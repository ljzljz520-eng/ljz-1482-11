version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    volumes:
      - studio-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - studio-net

  backend:
    build: ./backend
    container_name: studio-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ROLE: api
      PORT: "3001"
      DATABASE_URL: postgresql://studio:studio@db:5432/studio?schema=public
      STORAGE_DIR: /data/uploads
      WORKER_POLL_MS: "1200"
      WORKER_JOB_DELAY_MS: "1500"
    volumes:
      - studio-uploads:/data/uploads
    ports:
      - "8000:3001"
    networks:
      - studio-net

  worker:
    build: ./backend
    container_name: studio-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      ROLE: worker
      DATABASE_URL: postgresql://studio:studio@db:5432/studio?schema=public
      STORAGE_DIR: /data/uploads
      WORKER_POLL_MS: "1200"
      WORKER_JOB_DELAY_MS: "1500"
    volumes:
      - studio-uploads:/data/uploads
    networks:
      - studio-net

  frontend:
    build: ./frontend
    container_name: studio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - studio-net

volumes:
  studio-pgdata:
  studio-uploads:

networks:
  studio-net:
    driver: bridge
